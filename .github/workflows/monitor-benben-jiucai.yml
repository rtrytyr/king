name: 监控-笨笨的韭菜

on:
  schedule:
    # 每5分钟检查一次
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检查更新并推送
        env:
          RSS_URL: "https://rsshub.app/bilibili/user/dynamic/11473291"
          WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          FILE_NAME: "benben_guid.txt"
        run: |
          # 读取上一次的最新动态ID
          LAST_GUID=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/cache/$FILE_NAME || echo "")
          
          # 获取最新动态
          RSS_CONTENT=$(curl -s "$RSS_URL")
          
          # 提取最新一条的标题、链接、ID
          NEW_TITLE=$(echo "$RSS_CONTENT" | grep -oP '<title><!\[CDATA\[\K.*?(?=\]\]></title>)' | head -1)
          NEW_LINK=$(echo "$RSS_CONTENT" | grep -oP '<link>\K.*?(?=</link>)' | head -1)
          NEW_GUID=$(echo "$RSS_CONTENT" | grep -oP '<guid isPermaLink="false">\K.*?(?=</guid>)' | head -1)

          # 有新动态就推送
          if [ "$NEW_GUID" != "$LAST_GUID" ] && [ -n "$NEW_GUID" ]; then
            curl -s "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"msgtype\": \"markdown\",
                \"markdown\": {
                  \"content\": \"### 📺 笨笨的韭菜 更新了\n\n**标题**：$NEW_TITLE\n\n**直达链接**：[点击查看]($NEW_LINK)\"
                }
              }"
            
            # 保存最新ID
            echo "$NEW_GUID" > $FILE_NAME
            
            # 提交到仓库缓存
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone --branch cache --single-branch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git cache-repo || git init
            cd cache-repo || exit
            git checkout -b cache || true
            cp ../$FILE_NAME .
            git add $FILE_NAME
            git commit -m "update $FILE_NAME" || true
            git push --set-upstream origin cache || true
          fi
