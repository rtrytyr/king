name: 监控-史诗级韭菜

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检查更新并推送
        env:
          UP_MID: "322005137"
          WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          CACHE_FILE: "shishiji_guid.txt"
        run: |
          echo "=== 调用B站API获取最新动态 ==="
          API_URL="https://api.bilibili.com/x/polymer/web-dynamic/v1/feed/space?host_mid=$UP_MID"
          
          # 携带完整浏览器请求头，绕过反爬校验
          RESPONSE=$(curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://www.bilibili.com/" \
            -H "Accept: application/json, text/plain, */*" \
            "$API_URL")
          
          # 调试：打印返回状态和前200字符，方便排查
          echo "原始响应前200字符: ${RESPONSE:0:200}"
          
          # 提取最新动态ID、内容
          NEW_ID=$(echo "$RESPONSE" | grep -o '"id_str":"[^"]*"' | head -1 | cut -d'"' -f4)
          NEW_DESC=$(echo "$RESPONSE" | grep -o '"text":"[^"]*"' | head -1 | cut -d'"' -f4)
          NEW_LINK="https://t.bilibili.com/$NEW_ID"

          echo "最新动态ID: $NEW_ID"
          echo "动态内容: $NEW_DESC"

          if [ -z "$NEW_ID" ]; then
            echo "❌ 获取动态失败，接口返回异常"
            exit 1
          fi

          # 读取上次记录
          LAST_ID=$(curl -sL https://raw.githubusercontent.com/${{ github.repository }}/cache/$CACHE_FILE 2>/dev/null || echo "")
          echo "上次记录ID: $LAST_ID"

          if [ "$NEW_ID" != "$LAST_ID" ]; then
            echo "✅ 检测到新动态，推送企业微信"
            
            # 处理纯图片/视频无文字的情况
            if [ -z "$NEW_DESC" ]; then
              NEW_DESC="发布了新动态（图片/视频）"
            fi
            
            # 推送消息
            curl -s -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{
                \"msgtype\": \"markdown\",
                \"markdown\": {
                  \"content\": \"### 📺 史诗级韭菜 更新了\n\n**内容**：$NEW_DESC\n\n**直达链接**：[点击查看]($NEW_LINK)\"
                }
              }"
            
            # 保存新ID到缓存
            echo "$NEW_ID" > $CACHE_FILE
            
            # 提交到仓库持久化
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            if git ls-remote --heads https://github.com/${{ github.repository }}.git cache | grep -q cache; then
              git clone --branch cache --single-branch https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git cache-repo
            else
              git init cache-repo
              cd cache-repo
              git checkout -b cache
              cd ..
            fi
            
            cp $CACHE_FILE cache-repo/
            cd cache-repo
            git add $CACHE_FILE
            git commit -m "update $CACHE_FILE" || true
            git push --set-upstream origin cache || true
          else
            echo "ℹ️ 暂无新动态"
          fi
